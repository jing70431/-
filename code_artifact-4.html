<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥋 功夫熊貓武道館地圖：身體打擊樂大冒險</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --slide-cream: #F9F6EE;
      --slide-gold: #F4BE41;
      --slide-gold-light: #FCE29C;
      --slide-gold-dark: #D99B16;
      --ink-dark: #1E293B;
      --accent-red: #D93829;
      --accent-jade: #10B981;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #EFF6FF;
      color: var(--ink-dark);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* 首頁地圖畫布：天空藍到草地綠漸層背景 */
    .map-canvas-bg {
      background: linear-gradient(180deg, #74C8F7 0%, #B3E5FC 55%, #C8E6C9 100%);
      border: 4px solid #38BDF8;
      border-radius: 28px;
      box-shadow: 0 12px 28px rgba(14, 116, 144, 0.16);
      position: relative;
      overflow: hidden;
    }

    /* 簡報主舞台卡片（溫暖米白＋墨黑粗框） */
    .slide-stage {
      background-color: var(--slide-cream);
      border: 4px solid #1E293B;
      box-shadow: 0 8px 0 #1E293B;
      position: relative;
      overflow: hidden;
    }

    .btn-3d {
      border: 3.5px solid #1E293B;
      box-shadow: 0 4px 0 #1E293B;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1E293B;
    }
    .btn-3d:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    /* 關卡圓形按鈕（已解鎖／已通關：金黃色；未解鎖：灰色） */
    .node-circle-unlocked {
      background: radial-gradient(circle at 35% 30%, #FEF08A 0%, #FACC15 55%, #EAB308 100%);
      border: 4px solid #CA8A04;
      box-shadow: 0 5px 0 #A16207, 0 0 0 4px rgba(255, 255, 255, 0.9);
      color: #713F12;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .node-circle-unlocked:hover {
      transform: scale(1.08);
    }
    .node-circle-unlocked:active {
      transform: scale(0.95) translateY(2px);
    }

    .node-circle-current {
      animation: currentPulse 1.8s infinite ease-in-out;
    }
    @keyframes currentPulse {
      0%, 100% { box-shadow: 0 5px 0 #A16207, 0 0 0 4px rgba(255, 255, 255, 0.95); }
      50% { box-shadow: 0 5px 0 #A16207, 0 0 0 11px rgba(250, 204, 21, 0.45); }
    }

    .node-circle-locked {
      background: #CBD5E1;
      border: 4px solid #94A3B8;
      box-shadow: 0 4px 0 #94A3B8, 0 0 0 3px rgba(255, 255, 255, 0.7);
      color: #475569;
    }

    /* 功夫熊貓角色站立在目前最高可挑戰關卡上方 */
    @keyframes pandaHop {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -8px); }
    }
    .panda-avatar-stand {
      position: absolute;
      left: 50%;
      top: -58px;
      z-index: 25;
      pointer-events: none;
      animation: pandaHop 1.4s infinite ease-in-out;
      filter: drop-shadow(0 4px 5px rgba(15, 23, 42, 0.25));
    }

    /* 白色膠囊招式標籤 */
    .pill-label-unlocked {
      background: #FFFFFF;
      border: 3px solid #E2E8F0;
      box-shadow: 0 4px 0 #CBD5E1;
      color: #1E293B;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }
    .pill-label-unlocked:hover {
      background: #FEF9C3;
      border-color: #FACC15;
      transform: scale(1.04);
    }
    .pill-label-locked {
      background: rgba(255, 255, 255, 0.75);
      border: 2.5px solid #CBD5E1;
      color: #64748B;
    }

    /* 招式點擊彈跳動畫 */
    @keyframes kungfuBounce {
      0% { transform: scale(1); }
      35% { transform: scale(0.92); }
      70% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .animate-kungfu-bounce {
      animation: kungfuBounce 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* =========================================================
       第一關：三個動作連續動態示範動畫（拍手、拍腿、跺腳）
       ========================================================= */
    @keyframes animClapLeft {
      0%, 100% { transform: translate(-18px, 6px) rotate(-14deg); }
      45% { transform: translate(0px, 0px) rotate(0deg); }
      55% { transform: translate(2px, -2px) rotate(2deg); }
    }
    @keyframes animClapRight {
      0%, 100% { transform: translate(18px, 6px) rotate(14deg); }
      45% { transform: translate(0px, 0px) rotate(0deg); }
      55% { transform: translate(-2px, -2px) rotate(-2deg); }
    }
    @keyframes animImpactPop {
      0%, 36%, 100% { opacity: 0; transform: scale(0.5); }
      48% { opacity: 1; transform: scale(1.12); }
      75% { opacity: 0.4; transform: scale(1.22); }
    }
    @keyframes animPatLeftHand {
      0%, 100% { transform: translateY(-22px) scale(1.04); }
      45% { transform: translateY(4px) scale(0.96); }
      60% { transform: translateY(0px) scale(1); }
    }
    @keyframes animPatRightHand {
      0%, 100% { transform: translateY(-22px) scale(1.04); }
      45% { transform: translateY(4px) scale(0.96); }
      60% { transform: translateY(0px) scale(1); }
    }
    @keyframes animPatLegs {
      0%, 38%, 100% { transform: translateY(0px); }
      48% { transform: translateY(4px); }
    }
    @keyframes animStompFoot {
      0%, 100% { transform: translate(6px, -28px) rotate(-24deg); }
      45% { transform: translate(0px, 4px) rotate(-10deg); }
      58% { transform: translate(0px, 0px) rotate(-14deg); }
    }
    @keyframes animFloorRipple {
      0%, 38%, 100% { opacity: 0.25; transform: scale(0.88); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .dyn-clap-left {
      transform-origin: 95px 175px;
      animation: animClapLeft 0.95s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dyn-clap-right {
      transform-origin: 125px 185px;
      animation: animClapRight 0.95s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dyn-clap-sparks {
      transform-origin: 112px 35px;
      animation: animImpactPop 0.95s infinite ease-out;
    }
    .dyn-pat-left {
      transform-origin: 75px 45px;
      animation: animPatLeftHand 0.95s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dyn-pat-right {
      transform-origin: 145px 45px;
      animation: animPatRightHand 0.95s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dyn-pat-legs {
      animation: animPatLegs 0.95s infinite ease-out;
    }
    .dyn-pat-sparks {
      transform-origin: 110px 75px;
      animation: animImpactPop 0.95s infinite ease-out;
    }
    .dyn-stomp-foot {
      transform-origin: 114px 148px;
      animation: animStompFoot 0.95s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dyn-stomp-sparks {
      transform-origin: 105px 185px;
      animation: animFloorRipple 0.95s infinite ease-out;
    }

    /* 氣功波紋光圈 */
    @keyframes qiWave {
      0% { opacity: 0.92; transform: scale(0.86); }
      100% { opacity: 0; transform: scale(1.24); }
    }
    .qi-pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 1.5rem;
      border: 6px solid #F4BE41;
      pointer-events: none;
      animation: qiWave 0.48s ease-out forwards;
    }

    /* 節拍亮起效果 */
    .beat-lit {
      transform: scale(1.06) translateY(-5px);
      background-color: #FEF3C7 !important;
      border-color: #D93829 !important;
      box-shadow: 0 8px 0 #D93829, 0 0 0 5px rgba(244, 190, 65, 0.58) !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 全螢幕彩色紙花慶祝畫布 -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 hidden"></canvas>

  <!-- =========================================================
       頂部工具列（左「📊 學習紀錄」、中「🥋 功夫熊貓武道館地圖」、右「🔄 重新開始」）
       ========================================================= -->
  <header class="w-full max-w-6xl mx-auto px-3 sm:px-6 pt-3 pb-2 flex items-center justify-between gap-2">
    <button onclick="openProgressModal()" class="bg-white hover:bg-sky-50 border-2 border-slate-300 shadow-sm rounded-2xl px-3.5 py-2 font-black text-sm sm:text-base text-slate-700 flex items-center gap-1.5 transition-transform active:scale-95">
      <span>📊</span>
      <span>學習紀錄</span>
    </button>

    <h1 onclick="backToMap()" class="cursor-pointer text-xl sm:text-3xl font-black text-[#0F172A] tracking-wide text-center flex items-center justify-center gap-2">
      <span>🥋</span>
      <span>功夫熊貓武道館地圖</span>
    </h1>

    <button onclick="openResetModal()" class="bg-white hover:bg-sky-50 border-2 border-slate-300 shadow-sm rounded-2xl px-3.5 py-2 font-black text-sm sm:text-base text-slate-700 flex items-center gap-1 transition-transform active:scale-95">
      <span>🔄</span>
      <span>重新開始</span>
    </button>
  </header>

  <!-- 鎖定關卡輕提示橫幅 -->
  <div id="toast-banner" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-[#1E293B] text-[#FACC15] border-3 border-[#FACC15] px-5 py-2.5 rounded-2xl font-black text-base sm:text-lg shadow-xl">
    🔒 請先完成前面的關卡，才能解鎖這一關！
  </div>

  <!-- =========================================================
       主畫面一：【首頁地圖視圖】（垂直 4 關路徑＋左右交錯白色膠囊標籤）
       ========================================================= -->
  <main id="screen-map" class="flex-1 w-full max-w-6xl mx-auto px-3 sm:px-6 pb-5 flex flex-col">
    <div class="map-canvas-bg flex-1 w-full py-12 sm:py-14 px-3 flex flex-col items-center justify-center min-h-[580px]">
      <!-- 垂直 4 大關卡路徑容器（由上到下渲染 4 -> 1，讓視覺呈由下往上 1 到 4 攀升） -->
      <div id="vertical-map-track" class="relative w-full max-w-2xl flex flex-col items-center justify-between gap-10 sm:gap-12 py-4">
        <!-- 由 JS 動態渲染白色垂直粗路徑線與 4 至 1 關卡節點 -->
      </div>
    </div>
  </main>

  <!-- =========================================================
       主畫面二：【簡報闖關教學舞台】（點擊關卡後進入）
       ========================================================= -->
  <main id="screen-stage" class="hidden flex-1 w-full max-w-6xl mx-auto px-3 sm:px-6 pb-8">
    <div class="slide-stage rounded-3xl p-5 sm:p-8">
      <!-- 簡報頂部暖黃雙層弧形波浪 -->
      <svg viewBox="0 0 1200 76" preserveAspectRatio="none" class="w-full h-8 sm:h-11 absolute top-0 left-0 pointer-events-none">
        <path d="M0,0 L1200,0 L1200,32 Q600,82 0,32 Z" fill="#FCE29C" />
        <path d="M0,0 L1200,0 L1200,20 Q600,66 0,20 Z" fill="#F4BE41" />
      </svg>

      <div class="relative z-10 pt-5 pb-5 space-y-5">
        <!-- 舞台頂部導覽列：「⬅️ 返回武道館地圖」、目前關卡標題、小題進度點 -->
        <div class="flex flex-wrap items-center justify-between gap-3 border-b-3 border-stone-300 pb-3">
          <button onclick="backToMap()" class="btn-3d bg-[#F4BE41] hover:bg-amber-300 text-[#1E293B] font-black px-4 py-2 rounded-2xl text-base sm:text-lg flex items-center gap-1.5">
            <span>⬅️</span>
            <span>返回武道館地圖</span>
          </button>

          <div class="flex flex-wrap items-center gap-2 sm:gap-3">
            <span id="stage-level-pill" class="bg-[#D93829] text-white border-3 border-[#1E293B] px-4 py-1.5 rounded-2xl font-black text-base sm:text-xl">
              第一關：🐼 認識動作含義
            </span>
            <span id="stage-step-pill" class="bg-white text-[#1E293B] border-3 border-[#1E293B] px-3.5 py-1.5 rounded-2xl font-black text-sm sm:text-base">
              第 1 / 3 個
            </span>
          </div>
        </div>

        <!-- =======================================================
             【第一關：認識每個動作代表含義】（一次只呈現單一個大圖文卡片）
             ======================================================= -->
        <div id="mode-level-1" class="hidden space-y-6">
          <div class="max-w-md mx-auto">
            <div id="l1-action-card" onclick="triggerLevel1Sound()" class="relative cursor-pointer bg-white border-4 border-[#1E293B] rounded-3xl p-6 sm:p-8 flex flex-col items-center text-center shadow-md hover:bg-amber-50/70 transition-colors">
              <div id="l1-action-svg" class="w-56 h-56 sm:w-64 sm:h-64 my-2"></div>
              <div id="l1-action-name" class="mt-3 text-4xl sm:text-5xl font-black text-[#1E293B] tracking-wider">
                拍手
              </div>
            </div>
          </div>

          <!-- 底部左右導覽控制列 -->
          <div class="flex flex-wrap items-center justify-center gap-4 pt-1">
            <button onclick="prevLevel1Action()" id="l1-prev-btn" class="btn-3d bg-white hover:bg-slate-100 text-[#1E293B] font-black px-6 py-4 rounded-2xl text-lg sm:text-xl flex items-center gap-2">
              <span>⬅️</span>
              <span>上一個</span>
            </button>

            <button onclick="nextOrFinishLevel1()" id="l1-next-btn" class="btn-3d bg-[#10B981] hover:bg-emerald-400 text-[#1E293B] font-black px-7 py-4 rounded-2xl text-lg sm:text-xl flex items-center gap-2">
              <span>下一個</span>
              <span>➡️</span>
            </button>
          </div>
        </div>

        <!-- =======================================================
             【第二、三、四關：看圖做動作 -> 公佈答案並示範】
             ======================================================= -->
        <div id="mode-challenge" class="hidden space-y-5">
          <!-- 上方題目進度圓圈（1～12題）＋ 隨機換題 -->
          <div class="bg-white/90 border-3 border-[#1E293B] rounded-2xl p-3 flex flex-wrap items-center justify-between gap-3">
            <div id="challenge-dots-bar" class="flex flex-wrap items-center gap-1.5 sm:gap-2"></div>
            <button onclick="generateRandomQuestionForCurrentLevel()" class="btn-3d bg-[#F4BE41] hover:bg-amber-300 text-[#1E293B] font-black px-4 py-2 rounded-2xl text-sm sm:text-base flex items-center gap-1.5">
              <span>🎲</span>
              <span>隨機換題</span>
            </button>
          </div>

          <!-- 題目圖片卡片區（動態適應 2～6 拍並排） -->
          <div id="challenge-beats-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4"></div>

          <!-- 公佈答案後顯示的清晰中文順序與次數橫幅 -->
          <div id="challenge-answer-banner" class="hidden bg-[#ECFDF5] border-4 border-[#10B981] rounded-2xl p-4 text-center shadow-sm">
            <div id="challenge-answer-text" class="text-2xl sm:text-3xl font-black text-[#065F46] tracking-wide">
              拍手 3 次
            </div>
          </div>

          <!-- 兩步驟課堂控制列（無節拍器，僅保留公佈答案與下一題） -->
          <div class="bg-white/90 border-3 border-[#1E293B] rounded-2xl p-4 flex flex-wrap items-center justify-center gap-3 sm:gap-4">
            <button onclick="revealChallengeAnswer()" id="challenge-reveal-btn" class="btn-3d bg-[#10B981] hover:bg-emerald-400 text-[#1E293B] font-black px-7 py-4 rounded-2xl text-xl sm:text-2xl flex items-center gap-2">
              <span>🎉</span>
              <span>公佈答案並示範</span>
            </button>

            <button onclick="replayChallengeDemo()" id="challenge-replay-btn" class="hidden btn-3d bg-[#F4BE41] hover:bg-amber-300 text-[#1E293B] font-black px-6 py-4 rounded-2xl text-lg sm:text-xl flex items-center gap-2">
              <span>🔊</span>
              <span>再聽一次示範</span>
            </button>

            <button onclick="nextQuestionOrCompleteLevel()" id="challenge-next-btn" class="hidden btn-3d bg-[#D93829] hover:bg-red-600 text-white font-black px-7 py-4 rounded-2xl text-xl sm:text-2xl flex items-center gap-2">
              <span>➡️</span>
              <span>下一題</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 簡報底部暖黃雙層弧形波浪 -->
      <svg viewBox="0 0 1200 76" preserveAspectRatio="none" class="w-full h-8 sm:h-11 absolute bottom-0 left-0 pointer-events-none">
        <path d="M0,76 L1200,76 L1200,44 Q600,-6 0,44 Z" fill="#FCE29C" />
        <path d="M0,76 L1200,76 L1200,56 Q600,10 0,56 Z" fill="#F4BE41" />
      </svg>
    </div>
  </main>

  <!-- =========================================================
       彈窗一：【📊 學習紀錄】4 關通關狀態＋老師專用一鍵解鎖全部關卡
       ========================================================= -->
  <div id="progress-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-[#FFFDF9] border-4 border-[#1E293B] rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b-3 border-slate-200 pb-3">
        <h2 class="text-2xl font-black text-[#1E293B] flex items-center gap-2">
          <span>📊</span>
          <span>學習紀錄</span>
        </h2>
        <button onclick="closeProgressModal()" class="w-9 h-9 rounded-full bg-slate-200 hover:bg-slate-300 font-black text-lg text-slate-700">✕</button>
      </div>

      <div id="progress-list" class="space-y-2.5">
        <!-- 由 JS 動態渲染 1～4 關通關狀態 -->
      </div>

      <div class="pt-3 flex flex-wrap items-center justify-between gap-2 border-t-3 border-slate-200">
        <button onclick="unlockAllLevelsForTeacher()" class="btn-3d bg-[#F4BE41] hover:bg-amber-300 text-[#1E293B] font-black px-4 py-2.5 rounded-2xl text-sm sm:text-base">
          🔓 老師專用：解鎖全部關卡
        </button>
        <button onclick="closeProgressModal()" class="btn-3d bg-[#10B981] text-[#1E293B] font-black px-5 py-2.5 rounded-2xl text-sm sm:text-base">
          關閉
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================
       彈窗二：【🔄 重新開始確認】替代原生 confirm()
       ========================================================= -->
  <div id="reset-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-[#FFFDF9] border-4 border-[#1E293B] rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
      <div class="text-4xl">🔄</div>
      <h2 class="text-2xl font-black text-[#1E293B]">確定要重新開始嗎？</h2>
      <div class="flex justify-center gap-3 pt-2">
        <button onclick="closeResetModal()" class="btn-3d bg-white text-[#1E293B] font-black px-5 py-2.5 rounded-2xl text-base">
          取消
        </button>
        <button onclick="executeResetAll()" class="btn-3d bg-[#D93829] text-white font-black px-5 py-2.5 rounded-2xl text-base">
          確定重置
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================
       彈窗三：【🏆 神龍大俠獎章】第四關全通關慶祝彈窗
       ========================================================= -->
  <div id="medal-modal" class="hidden fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
    <div class="slide-stage rounded-3xl max-w-md w-full p-6 sm:p-8 text-center">
      <svg viewBox="0 0 1200 76" preserveAspectRatio="none" class="w-full h-8 absolute top-0 left-0 pointer-events-none">
        <path d="M0,0 L1200,0 L1200,32 Q600,82 0,32 Z" fill="#FCE29C" />
        <path d="M0,0 L1200,0 L1200,20 Q600,66 0,20 Z" fill="#F4BE41" />
      </svg>

      <div class="relative z-10 pt-5 pb-5 space-y-4">
        <div class="w-24 h-24 mx-auto rounded-full bg-[#FACC15] border-4 border-[#1E293B] flex items-center justify-center text-5xl shadow-md animate-bounce">
          🐼
        </div>
        <div class="inline-block bg-[#D93829] text-white font-black px-4 py-1 rounded-full border-2 border-[#1E293B] text-sm">
          四大關卡全部過關
        </div>
        <h2 class="text-3xl font-black text-[#1E293B]">
          神龍大俠獎章
        </h2>
        <div class="pt-2 flex flex-col sm:flex-row gap-3 justify-center">

    /* ==========================================================================
       3. Web Audio API 真實身體打擊樂音效合成器（無需外部音檔）
       ========================================================================== */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBodyPercussion(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'clap') {
          // 清脆高頻雙層濾波白噪音擊掌聲
          [0, 0.016].forEach(offset => {
            const bufferSize = Math.floor(audioCtx.sampleRate * 0.14);
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.032));
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1450, now + offset);
            filter.Q.setValueAtTime(1.3, now + offset);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.92, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.13);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(now + offset);
          });
        } else if (type === 'pat') {
          // 溫暖中低頻共鳴拍擊聲
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(215, now);
          osc.frequency.exponentialRampToValueAtTime(72, now + 0.16);

          gain.gain.setValueAtTime(0.95, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.19);
        } else if (type === 'stomp') {
          // 厚實低頻大鼓重踏聲
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(138, now);
          osc.frequency.exponentialRampToValueAtTime(36, now + 0.28);

          gain.gain.setValueAtTime(1.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.31);
        }
      } catch (e) {}
    }

    function playVictoryGong() {
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [261.63, 293.66, 329.63, 392.0, 523.25].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.36, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.005, now + idx * 0.08 + 0.75);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.78);
        });
      } catch (e) {}
    }

    const mapState = {

    let toastTimer = null;
    function showLockedToast() {

    function renderVerticalMap() {
      const track = document.getElementById('vertical-map-track');
      if (!track) return;

      // 功夫熊貓站立在目前可挑戰的最高關卡上方

      let html = `
        <!-- 中央白色垂直粗路徑線 -->

        const statusBadge = isCompleted
          ? ' ⭐'
          : (!isUnlocked ? ' 🔒' : '');

        const nodeContent = isUnlocked
          ? `<span>${lv.id}</span>`
          : `<span class="text-2xl sm:text-3xl">🔒</span>`;

        const leftSlotHtml = lv.side === 'left'
          ? `<button onclick="openLevel(${lv.id})" class="${pillClass} px-4 sm:px-6 py-2.5 rounded-full font-black text-base sm:text-xl whitespace-nowrap">
               ${lv.label}${statusBadge}
             </button>`
          : '';

        const rightSlotHtml = lv.side === 'right'
          ? `<button onclick="openLevel(${lv.id})" class="${pillClass} px-4 sm:px-6 py-2.5 rounded-full font-black text-base sm:text-xl whitespace-nowrap">
               ${lv.label}${statusBadge}
             </button>`
          : '';

        html += `
          <div class="relative z-10 w-full grid grid-cols-[1fr_auto_1fr] items-center gap-3 sm:gap-6">
            <div class="flex justify-end">
              ${leftSlotHtml}
            </div>

            <div class="relative flex items-center justify-center">
              ${isPandaHere ? `<div class="panda-avatar-stand">${PANDA_AVATAR_SVG}</div>` : ''}
              <button onclick="openLevel(${lv.id})" class="${circleClass} w-16 h-16 sm:w-20 sm:h-20 rounded-full font-black text-2xl sm:text-4xl flex items-center justify-center">
                ${nodeContent}
              </button>
            </div>

            <div class="flex justify-start">
              ${rightSlotHtml}
            </div>
          </div>
        `;
      }

      track.innerHTML = html;
    }

    function backToMap() {
      stopAllAudioLoops();
      document.getElementById('screen-stage').classList.add('hidden');
      document.getElementById('screen-map').classList.remove('hidden');
      renderVerticalMap();
    }

    function openLevel(levelId) {
      if (levelId > mapState.unlockedUpTo) {
        showLockedToast();
        return;
      }

      stopAllAudioLoops();
      mapState.activeLevelId = levelId;

      const lv = LEVELS_DATA.find(item => item.id === levelId);
      if (!lv) return;

      document.getElementById('screen-map').classList.add('hidden');
      document.getElementById('screen-stage').classList.remove('hidden');
      document.getElementById('stage-level-pill').textContent = `${lv.numText}：${lv.label}`;

      document.getElementById('mode-level-1').classList.add('hidden');
      document.getElementById('mode-challenge').classList.add('hidden');

      if (levelId === 1) {
        setupLevel1();
      } else {
        setupChallengeLevel(lv);
      }
    }

    /* ==========================================================================
       5. 學習紀錄與重新開始彈窗（無原生 confirm / alert）
       ========================================================================== */
    function openProgressModal() {
      const list = document.getElementById('progress-list');
      list.innerHTML = LEVELS_DATA.map(lv => {
        const isCompleted = mapState.completedLevels.has(lv.id);
        const isUnlocked = lv.id <= mapState.unlockedUpTo;
        let statusText = '🔒 尚未解鎖';
        let rowStyle = 'bg-slate-100 border-slate-300 text-slate-500';
        if (isCompleted) {
          statusText = '⭐ 已完成過關';
          rowStyle = 'bg-amber-50 border-amber-400 text-[#1E293B]';
        } else if (isUnlocked) {
          statusText = '🐼 挑戰中';
          rowStyle = 'bg-sky-50 border-sky-400 text-[#1E293B]';
        }
        return `
          <div onclick="${isUnlocked ? `closeProgressModal(); openLevel(${lv.id});` : 'showLockedToast()'}"
               class="cursor-pointer border-2 ${rowStyle} rounded-2xl px-4 py-3 flex items-center justify-between font-black text-base sm:text-lg transition-transform active:scale-98">
            <span>${lv.numText}：${lv.label}</span>
            <span>${statusText}</span>
          </div>
        `;
      }).join('');
      document.getElementById('progress-modal').classList.remove('hidden');
    }

    function closeProgressModal() {
      document.getElementById('progress-modal').classList.add('hidden');
    }

    function unlockAllLevelsForTeacher() {
      mapState.unlockedUpTo = 4;
      renderVerticalMap();
      openProgressModal();
    }

    function openResetModal() {
      document.getElementById('reset-modal').classList.remove('hidden');
    }

    function closeResetModal() {
      document.getElementById('reset-modal').classList.add('hidden');
    }

    function executeResetAll() {
      stopAllAudioLoops();
      mapState.unlockedUpTo = 1;
      mapState.completedLevels.clear();
      closeResetModal();
      backToMap();
    }

    /* ==========================================================================
       6. 第一關：【認識每個動作代表含義】（一次僅呈現單一個大圖文卡片）
       ========================================================================== */
    const LEVEL_1_ACTIONS = ['clap', 'pat', 'stomp'];
    let l1CurrentIdx = 0;

    function setupLevel1() {
      l1CurrentIdx = 0;
      document.getElementById('mode-level-1').classList.remove('hidden');
      renderLevel1Card();
    }

    function renderLevel1Card() {
      const actionKey = LEVEL_1_ACTIONS[l1CurrentIdx];
      document.getElementById('stage-step-pill').textContent = `第 ${l1CurrentIdx + 1} / 3 個`;
      document.getElementById('l1-action-svg').innerHTML = getActionCartoonSVG(actionKey, null, true);
      document.getElementById('l1-action-name').textContent = ACTION_LABELS[actionKey];

      const prevBtn = document.getElementById('l1-prev-btn');
      prevBtn.disabled = l1CurrentIdx === 0;

      const nextBtn = document.getElementById('l1-next-btn');
      if (l1CurrentIdx < LEVEL_1_ACTIONS.length - 1) {
        nextBtn.innerHTML = '<span>下一個</span><span>➡️</span>';
        nextBtn.className = 'btn-3d bg-[#10B981] hover:bg-emerald-400 text-[#1E293B] font-black px-7 py-4 rounded-2xl text-lg sm:text-xl flex items-center gap-2';
      } else {
        nextBtn.innerHTML = '<span>⭐</span><span>完成第一關，解鎖第二關！</span>';
        nextBtn.className = 'btn-3d bg-[#F4BE41] hover:bg-amber-300 text-[#1E293B] font-black px-7 py-4 rounded-2xl text-lg sm:text-xl flex items-center gap-2';
      }
    }

    function triggerLevel1Sound() {
      const actionKey = LEVEL_1_ACTIONS[l1CurrentIdx];
      playBodyPercussion(actionKey);

      const card = document.getElementById('l1-action-card');
      card.classList.remove('animate-kungfu-bounce');
      void card.offsetWidth;
      card.classList.add('animate-kungfu-bounce');

      const ring = document.createElement('div');
      ring.className = 'qi-pulse-ring';
      card.appendChild(ring);
      setTimeout(() => ring.remove(), 500);
    }

    function prevLevel1Action() {
      if (l1CurrentIdx > 0) {
        l1CurrentIdx--;
        renderLevel1Card();
        triggerLevel1Sound();
      }
    }

    function nextOrFinishLevel1() {
      if (l1CurrentIdx < LEVEL_1_ACTIONS.length - 1) {
        l1CurrentIdx++;
        renderLevel1Card();
        triggerLevel1Sound();
      } else {
        // 完成第一關，解鎖並進入第二關
        mapState.completedLevels.add(1);
        if (mapState.unlockedUpTo < 2) mapState.unlockedUpTo = 2;
        playVictoryGong();
        openLevel(2);
      }
    }

    /* ==========================================================================
       7. 第二、三、四關：【看圖做動作 -> 公佈答案並示範】
          嚴格遵守每一關的出題規則與隨機生成器
       ========================================================================== */
    let activeChallengeLevel = null;
    let challengeQuestions = [];
    let challengeQIndex = 0;
    let challengeRevealed = false;
    let lastRandomSignature = '';
    const FIXED_DEMO_BEAT_MS = 650;

    function setupChallengeLevel(lv) {
      activeChallengeLevel = lv;
      challengeQuestions = lv.fixedQuestions.map(q => [...q]);
      challengeQIndex = 0;
      challengeRevealed = false;
      lastRandomSignature = challengeQuestions[0].join(',');

      document.getElementById('mode-challenge').classList.remove('hidden');
      renderChallengeView();
    }

    /* 嚴格遵守各關規則的隨機題目產生器 */
    function buildRandomSequenceForLevel(levelId) {
      const allActions = ['clap', 'pat', 'stomp'];
      let seq = [];
      let attempts = 0;

      do {
        attempts++;
        if (levelId === 2) {
          // 第二關：一次一個動作，且一個動作做 2～4 次
          const chosen = allActions[Math.floor(Math.random() * allActions.length)];
          const count = 2 + Math.floor(Math.random() * 3); // 2, 3, or 4
          seq = Array(count).fill(chosen);
        } else if (levelId === 3) {
          // 第三關：一次兩個動作，每個動作可出現 1～2 次（總拍數 2～4 拍）
          const shuffled = [...allActions].sort(() => Math.random() - 0.5);
          const a1 = shuffled[0];
          const a2 = shuffled[1];
          const c1 = 1 + Math.floor(Math.random() * 2); // 1 or 2
          const c2 = 1 + Math.floor(Math.random() * 2); // 1 or 2
          seq = [...Array(c1).fill(a1), ...Array(c2).fill(a2)].sort(() => Math.random() - 0.5);
        } else if (levelId === 4) {
          // 第四關：一次三個動作，每個動作出現次數不限（總拍數 4～6 拍，包含全部 3 種動作）
          const totalBeats = 4 + Math.floor(Math.random() * 3); // 4, 5, or 6
          seq = [...allActions];
          while (seq.length < totalBeats) {
            seq.push(allActions[Math.floor(Math.random() * allActions.length)]);
          }
          seq.sort(() => Math.random() - 0.5);
        }
      } while (seq.join(',') === lastRandomSignature && attempts < 12);

      lastRandomSignature = seq.join(',');
      return seq;
    }

    function generateRandomQuestionForCurrentLevel() {
      stopAllAudioLoops();
      const newSeq = buildRandomSequenceForLevel(activeChallengeLevel.id);
      challengeQuestions[challengeQIndex] = newSeq;
      challengeRevealed = false;
      renderChallengeView();
    }

    /* 根據關卡規則格式化揭曉答案的清晰中文文字 */
    function formatAnswerSummary(levelId, seq) {
      if (levelId === 2) {
        // 例如：「拍手 3 次」
        return `${ACTION_LABELS[seq[0]]} ${seq.length} 次`;
      }

      if (levelId === 3) {
        // 將連續相同動作分組或統計次數，例如：「拍手 2 次 ➔ 拍腿 1 次」
        const counts = {};
        const order = [];
        seq.forEach(act => {
          if (!counts[act]) {
            counts[act] = 0;
            order.push(act);
          }
          counts[act]++;
        });
        return order.map(act => `${ACTION_LABELS[act]} ${counts[act]} 次`).join(' ➔ ');
      }

      // 第四關：顯示完整中文序列，例如：「拍手 ➔ 拍腿 ➔ 跺腳 ➔ 拍手」
      return seq.map(act => ACTION_LABELS[act]).join(' ➔ ');
    }

    function renderChallengeView() {
      const totalQ = challengeQuestions.length;
      const seq = challengeQuestions[challengeQIndex];
      document.getElementById('stage-step-pill').textContent = `第 ${challengeQIndex + 1} / ${totalQ} 題`;

      // 渲染上方 1～12 題號進度圓圈
      const dotsBar = document.getElementById('challenge-dots-bar');
      dotsBar.innerHTML = challengeQuestions.map((_, idx) => {
        const isCurrent = idx === challengeQIndex;
        const isDone = idx < challengeQIndex || (idx === challengeQIndex && challengeRevealed);
        let cls = 'w-8 h-8 sm:w-9 sm:h-9 rounded-full font-black text-xs sm:text-sm border-2 border-[#1E293B] flex items-center justify-center transition-all ';
        if (isCurrent) {
          cls += 'bg-[#D93829] text-white scale-110';
        } else if (isDone) {
          cls += 'bg-[#10B981] text-[#1E293B]';
        } else {
          cls += 'bg-white text-slate-500';
        }
        return `<button onclick="jumpToChallengeQuestion(${idx})" class="${cls}">${idx + 1}</button>`;
      }).join('');

      // 根據拍數自動調整網格欄數（2 拍 2 欄、3 拍 3 欄、4 拍 4 欄、5～6 拍 3 欄）
      const grid = document.getElementById('challenge-beats-grid');
      if (seq.length === 2) {
        grid.className = 'grid grid-cols-2 max-w-2xl mx-auto gap-4 sm:gap-6';
      } else if (seq.length === 3) {
        grid.className = 'grid grid-cols-1 sm:grid-cols-3 max-w-4xl mx-auto gap-4 sm:gap-5';
      } else if (seq.length === 4) {
        grid.className = 'grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-5';
      } else {
        grid.className = 'grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4';
      }

      grid.innerHTML = '';
      seq.forEach((type, idx) => {
        const beatNum = idx + 1;
        const card = document.createElement('div');
        card.id = `challenge-beat-${idx}`;
        card.className = `rhythm-box border-4 border-[#1E293B] rounded-3xl p-4 sm:p-5 flex flex-col items-center text-center shadow-sm transition-all duration-150 ${challengeRevealed ? 'bg-[#ECFDF5]' : 'bg-white'}`;

        // 出題時只顯示大圖片（隱藏文字答案），公佈答案後揭曉中文名稱
        const topLabelHtml = challengeRevealed
          ? `<div class="bg-[#10B981] text-[#1E293B] border-2 border-[#1E293B] px-4 py-1 rounded-full text-xl sm:text-2xl font-black mb-1">${ACTION_LABELS[type]}</div>`
          : `<div class="h-9 sm:h-10 mb-1"></div>`;

        card.innerHTML = `
          ${topLabelHtml}
          <div class="w-36 h-36 sm:w-44 sm:h-44 my-1">
            ${getActionCartoonSVG(type, beatNum)}
          </div>
        `;
        grid.appendChild(card);
      });

      // 答案文字橫幅與底部按鈕狀態
      const ansBanner = document.getElementById('challenge-answer-banner');
      const replayBtn = document.getElementById('challenge-replay-btn');
      const nextBtn = document.getElementById('challenge-next-btn');

      if (challengeRevealed) {
        ansBanner.classList.remove('hidden');
        document.getElementById('challenge-answer-text').textContent = formatAnswerSummary(activeChallengeLevel.id, seq);

        replayBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');

        if (challengeQIndex < totalQ - 1) {
          nextBtn.innerHTML = '<span>➡️</span><span>下一題</span>';
          nextBtn.className = 'btn-3d bg-[#D93829] hover:bg-red-600 text-white font-black px-7 py-4 rounded-2xl text-xl sm:text-2xl flex items-center gap-2';
        } else if (activeChallengeLevel.id < 4) {
          const nextLv = LEVELS_DATA.find(l => l.id === activeChallengeLevel.id + 1);
          nextBtn.innerHTML = `<span>⭐</span><span>完成${activeChallengeLevel.numText}，解鎖${nextLv.numText}！</span>`;
          nextBtn.className = 'btn-3d bg-[#F4BE41] hover:bg-amber-300 text-[#1E293B] font-black px-7 py-4 rounded-2xl text-xl sm:text-2xl flex items-center gap-2';
        } else {
          nextBtn.innerHTML = '<span>🏆</span><span>完成第四關！領取神龍大俠獎章</span>';
          nextBtn.className = 'btn-3d bg-[#F4BE41] hover:bg-amber-300 text-[#1E293B] font-black px-7 py-4 rounded-2xl text-xl sm:text-2xl flex items-center gap-2';
        }
      } else {
        ansBanner.classList.add('hidden');
        replayBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
      }
    }

    function jumpToChallengeQuestion(idx) {
      stopAllAudioLoops();
      challengeQIndex = idx;
      challengeRevealed = false;
      renderChallengeView();
    }

    function revealChallengeAnswer() {
      stopAllAudioLoops();
      challengeRevealed = true;
      renderChallengeView();
      playChallengeDemoMeasure();
    }

    function replayChallengeDemo() {
      stopAllAudioLoops();
      playChallengeDemoMeasure();
    }

    function nextQuestionOrCompleteLevel() {
      stopAllAudioLoops();
      if (challengeQIndex < challengeQuestions.length - 1) {
        challengeQIndex++;
        challengeRevealed = false;
        renderChallengeView();
        return;
      }

      // 完成該關全部題目
      const lvId = activeChallengeLevel.id;
      mapState.completedLevels.add(lvId);

      if (lvId < 4) {
        if (mapState.unlockedUpTo < lvId + 1) {
          mapState.unlockedUpTo = lvId + 1;
        }
        playVictoryGong();
        openLevel(lvId + 1);
      } else {
        // 完成第四關：施放彩色紙花、播放勝利鑼聲、開啟神龍大俠獎章彈窗
        playVictoryGong();
        launchCanvasConfetti();
        document.getElementById('medal-modal').classList.remove('hidden');
      }
    }

    /* ==========================================================================
       8. 答案自動亮燈演奏引擎（無節拍器）
       ========================================================================== */
    let scheduledTimers = [];

    function stopAllAudioLoops() {
      scheduledTimers.forEach(t => clearTimeout(t));
      scheduledTimers = [];
      document.querySelectorAll('.rhythm-box').forEach(el => el.classList.remove('beat-lit'));
    }

    function playChallengeDemoMeasure() {
      const seq = challengeQuestions[challengeQIndex];
      const beatCount = seq.length;

      for (let i = 0; i < beatCount; i++) {
        const tid = setTimeout(() => {
          document.querySelectorAll('#challenge-beats-grid .rhythm-box').forEach(el => el.classList.remove('beat-lit'));
          const card = document.getElementById(`challenge-beat-${i}`);
          if (card) card.classList.add('beat-lit');
          playBodyPercussion(seq[i]);
        }, i * FIXED_DEMO_BEAT_MS);
        scheduledTimers.push(tid);
      }

      const endTid = setTimeout(() => {
        document.querySelectorAll('#challenge-beats-grid .rhythm-box').forEach(el => el.classList.remove('beat-lit'));
      }, FIXED_DEMO_BEAT_MS * beatCount);
      scheduledTimers.push(endTid);
    }

    /* ==========================================================================
       9. 全螢幕 Canvas Confetti 彩色紙花慶祝動畫
       ========================================================================== */
    let confettiAnimId = null;

    function launchCanvasConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      canvas.classList.remove('hidden');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#FACC15', '#D93829', '#10B981', '#38BDF8', '#EC4899', '#A855F7'];
      const particles = Array.from({ length: 130 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: 8 + Math.random() * 10,
        h: 10 + Math.random() * 12,
        color: colors[Math.floor(Math.random() * colors.length)],
        vy: 3 + Math.random() * 4.5,
        vx: -2 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        vRot: -0.1 + Math.random() * 0.2
      }));

      let frames = 0;
      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

      function step() {
        frames++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });

        if (frames < 240) {
          confettiAnimId = requestAnimationFrame(step);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.classList.add('hidden');
        }
      }
      step();
    }

    function closeMedalModalAndMap() {
      document.getElementById('medal-modal').classList.add('hidden');
      backToMap();
    }

    function closeMedalAndReset() {
      document.getElementById('medal-modal').classList.add('hidden');
      executeResetAll();
    }

    /* ==========================================================================
       10. 初始化渲染首頁垂直地圖
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      renderVerticalMap();
    });
  </script>
